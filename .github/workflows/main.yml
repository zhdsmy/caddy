name: Docker Image Build and Push

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: caddy

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Determine version
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          else
            VERSION="$(tr -d '[:space:]' < VERSION)"
          fi
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "Building Caddy ${VERSION}"

      - name: Lint Dockerfile
        run: |
          docker run --rm -i hadolint/hadolint:v2.12.0-alpine \
            hadolint --ignore DL3006 --ignore DL3018 - < Dockerfile

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Check Dockerfile build rules
        run: |
          docker buildx build \
            --check \
            --build-arg CADDY_VERSION=${{ steps.version.outputs.version }} \
            .

      - name: Build smoke-test image
        id: smoke_build
        run: |
          docker buildx build \
            --pull \
            --no-cache-filter runtime \
            --load \
            --platform linux/amd64 \
            --tag "local/${IMAGE_NAME}:ci" \
            --build-arg CADDY_VERSION=${{ steps.version.outputs.version }} \
            .

      - name: Smoke test
        run: docker run --rm "local/${IMAGE_NAME}:ci" caddy version

      - name: Verify effective CA trust
        run: python3 tests/check_ca.py "local/${IMAGE_NAME}:ci"

      - name: Stage candidate in local registry
        run: |
          docker run -d --name scan-registry -p 127.0.0.1:5000:5000 registry:2.8.3
          docker tag "local/${IMAGE_NAME}:ci" "localhost:5000/${IMAGE_NAME}:ci"
          docker push "localhost:5000/${IMAGE_NAME}:ci"

      - name: Scan image vulnerabilities
        run: |
          docker run --rm --network host \
            -v hermes-op-trivy-cache:/root/.cache/trivy \
            -v "$PWD:/evidence" \
            aquasec/trivy@sha256:790fd66d1697395d8693d1acaa1ea702406a20f109b6fc7bac8db623eca6c06c \
            image --image-src remote --insecure --scanners vuln \
            --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 \
            --format json --output /evidence/trivy-results.json \
            "localhost:5000/${IMAGE_NAME}:ci"

      - name: Generate Trivy SARIF
        if: always() && steps.smoke_build.outcome == 'success'
        run: |
          docker run --rm --network host \
            -v hermes-op-trivy-cache:/root/.cache/trivy \
            -v "$PWD:/evidence" \
            aquasec/trivy@sha256:790fd66d1697395d8693d1acaa1ea702406a20f109b6fc7bac8db623eca6c06c \
            image --image-src remote --insecure --scanners vuln \
            --severity HIGH,CRITICAL --ignore-unfixed \
            --format sarif --output /evidence/trivy-results.sarif \
            "localhost:5000/${IMAGE_NAME}:ci"

      - name: Upload Trivy SARIF
        if: always() && hashFiles('trivy-results.sarif') != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: github/codeql-action/upload-sarif@v4
        continue-on-error: true
        with:
          sarif_file: trivy-results.sarif

  automerge:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login != 'dependabot[bot]'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Enable auto-merge
        env:
          GH_TOKEN: ${{ secrets.AUTOMATION_TOKEN }}
        run: gh pr merge "${{ github.event.pull_request.number }}" --repo "${{ github.repository }}" --admin --squash --delete-branch

  build:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Determine version
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          else
            VERSION="$(tr -d '[:space:]' < VERSION)"
          fi
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "Building Caddy ${VERSION}"

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ secrets.DOCKER_HUB_USERNAME }}/${{ env.IMAGE_NAME }}
          labels: |
            org.opencontainers.image.title=${{ env.IMAGE_NAME }}
            org.opencontainers.image.description=Custom Caddy image with Cloudflare DNS, L4, cache, and IP utility plugins
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ steps.version.outputs.version }},enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          pull: true
          no-cache-filters: runtime
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            CADDY_VERSION=${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Docker Hub Description
        uses: peter-evans/dockerhub-description@v5
        continue-on-error: true
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}
          repository: ${{ secrets.DOCKER_HUB_USERNAME }}/${{ env.IMAGE_NAME }}
          short-description: "Custom Caddy image with Cloudflare DNS, L4, cache, and IP utility plugins"
          readme-filepath: ./README.md
